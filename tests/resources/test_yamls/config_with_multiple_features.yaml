project:
    project_name: mock_project
    description: mock_description
    version: mock_version

input:
    source_type: mock # couldbe mock, local, sftp, s3
    config:
        source_path: mockdata/mockdata
    data_format: csv

configurations:
    df_type: 'pandas'

features:
    - location: 'https://github.com/RADAR-base-Analytics/mockfeatures'
      branch: main
      feature_groups:
        - MockFeatureGroup
      feature_names:
        - all
    - location: 'https://github.com/RADAR-base-Analytics/mockfeatures'
      branch: main
      feature_groups:
        - MockFeatureGroup2
      feature_names:
        - all
    # Custom features
    - location: custom
      feature_groups:
        - Tabularize
      feature_names:
       - android_phone_battery_level, android_phone_step_count
output:
    output_location: local # can be local, postgres, sftp
    config:
        target_path: tests/resources/test_output/
    data_format: csv
    compress: false